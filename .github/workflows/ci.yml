name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Every test writes its spans to a JSON file (100 % sampling in CI).
      MARDIK_TRACE_ARTIFACTS: test-artifacts/traces
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest tests/unit
      - name: Integration tests (session replay, multi-session, incidents)
        run: uv run pytest tests/integration
      - name: Integration tests detect every documented incident
        run: uv run python scripts/verify_incident_detection.py
      - name: Upload traces of every test case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-traces
          path: test-artifacts/traces
          if-no-files-found: ignore
